# Tells Netlify how to build and run this Next.js app.
# (Netlify reads this file from the project's base directory.)
[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime: runs the pages, logins, searches and uploads on Netlify's servers.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Public values (NEXT_PUBLIC_ ones are sent to the browser by design) and harmless names, so the secrets check skips them.
# Real keys (OpenAI, R2 access keys, Supabase) are still checked.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_MEDIA_URL,NEXT_PUBLIC_TEAM_WHATSAPP,NEXT_PUBLIC_MARKET_URL,OPENAI_MODEL,R2_BUCKET"
